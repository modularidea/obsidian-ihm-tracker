# Lokales Test-Setup: Stock-IHM (offizielles Image) + Fork-IHM (server-patch/)
# parallel, für End-to-End-Tests des Plugins gegen beide Varianten — siehe
# docs/todos.md Phase 1. Kein Produktions-Setup (SESSION_COOKIE_SECURE=False,
# offene Public-Project-Creation) — nur für lokale Entwicklung/Tests gedacht.

services:
  ihm-stock:
    image: ihatemoney/ihatemoney:latest
    environment:
      - DEBUG=False
      - ACTIVATE_DEMO_PROJECT=False
      - ACTIVATE_ADMIN_DASHBOARD=False
      - ADMIN_PASSWORD=
      - ALLOW_PUBLIC_PROJECT_CREATION=True
      - SECRET_KEY=local-test-only
      - SESSION_COOKIE_SECURE=False
      - SQLALCHEMY_DATABASE_URI=sqlite:////database/ihatemoney.db
      - APPLICATION_ROOT=/
      - ENABLE_CAPTCHA=False
      - PORT=8000
    ports:
      - "18000:8000"
    volumes:
      - ihm-stock-db:/database

  ihm-fork:
    build:
      context: ./server-patch
      dockerfile: Dockerfile
    environment:
      - DEBUG=False
      - ACTIVATE_DEMO_PROJECT=False
      - ACTIVATE_ADMIN_DASHBOARD=False
      - ADMIN_PASSWORD=
      - ALLOW_PUBLIC_PROJECT_CREATION=True
      - SECRET_KEY=local-test-only
      - SESSION_COOKIE_SECURE=False
      - SQLALCHEMY_DATABASE_URI=sqlite:////database/ihatemoney.db
      - APPLICATION_ROOT=/
      - ENABLE_CAPTCHA=False
      - PORT=8000
    ports:
      - "18001:8000"
    volumes:
      - ihm-fork-db:/database

  # Nextcloud + Cospend-App, lokal zum Gegentesten der Cospend-API-Recherche
  # (docs/ideas.md "Cospend-Support") — SQLite statt eigenem DB-Container,
  # reicht für einen einzelnen Test-Nutzer/Test-Projekt. Kein Produktions-Setup.
  nextcloud:
    image: nextcloud:latest
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin1234
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    ports:
      - "18080:80"
    volumes:
      - nextcloud-data:/var/www/html

volumes:
  ihm-stock-db:
  ihm-fork-db:
  nextcloud-data:
