# Local test setup: stock IHateMoney (official image) + the server-patch fork
# side by side, plus Nextcloud with Cospend. Development only — insecure
# defaults (open project creation, SESSION_COOKIE_SECURE=False).

services:
  ihm-stock:
    image: ihatemoney/ihatemoney:latest
    environment:
      - DEBUG=False
      - ACTIVATE_DEMO_PROJECT=False
      - ACTIVATE_ADMIN_DASHBOARD=False
      - ADMIN_PASSWORD=
      - ALLOW_PUBLIC_PROJECT_CREATION=True
      - SECRET_KEY=local-test-only
      - SESSION_COOKIE_SECURE=False
      - SQLALCHEMY_DATABASE_URI=sqlite:////database/ihatemoney.db
      - APPLICATION_ROOT=/
      - ENABLE_CAPTCHA=False
      - PORT=8000
    ports:
      - "18000:8000"
    volumes:
      - ihm-stock-db:/database

  ihm-fork:
    build:
      context: ./server-patch
      dockerfile: Dockerfile
    environment:
      - DEBUG=False
      - ACTIVATE_DEMO_PROJECT=False
      - ACTIVATE_ADMIN_DASHBOARD=False
      - ADMIN_PASSWORD=
      - ALLOW_PUBLIC_PROJECT_CREATION=True
      - SECRET_KEY=local-test-only
      - SESSION_COOKIE_SECURE=False
      - SQLALCHEMY_DATABASE_URI=sqlite:////database/ihatemoney.db
      - APPLICATION_ROOT=/
      - ENABLE_CAPTCHA=False
      - PORT=8000
    ports:
      - "18001:8000"
    volumes:
      - ihm-fork-db:/database

  # Nextcloud + Cospend (install the app via the admin UI after first start).
  # SQLite is enough for one test user.
  nextcloud:
    image: nextcloud:latest
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin1234
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    ports:
      - "18080:80"
    volumes:
      - nextcloud-data:/var/www/html

volumes:
  ihm-stock-db:
  ihm-fork-db:
  nextcloud-data:
